name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  web-build:
    name: Flutter Web 构建
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 显示版本
        run: flutter --version

      - name: 拉取依赖
        run: flutter pub get

      # 仅作提示：项目里的 lint 提示（info/warning）不阻塞构建
      - name: 静态检查（不阻塞）
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 构建门禁：能编译出 Web 产物即视为通过
      # 注：golden 截图比对测试依赖本机字体与平台（见 docs/screenshots），不在 CI 中运行
      - name: 构建 Web 产物
        run: flutter build web --release
