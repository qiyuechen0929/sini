org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 强制不走代理：这台机器上设了 http(s)_proxy 指向本地代理，但那个代理连不通
# 外网（连 Gradle 发行包都下不来）。国内镜像直连是通的，所以这里显式绕过代理。
systemProp.http.nonProxyHosts=*
systemProp.https.nonProxyHosts=*

# 项目路径里有中文（D:\sini\似你_flutter_前端_MVP\...），AGP 会直接拒绝构建：
# "Your project path contains non-ASCII characters"。
# 这是 Android 的老限制（b.android.com/95744），改目录名代价太大，
# 官方给的开关就是这一行。
android.overridePathCheck=true

# 项目在 D:、Pub 缓存在 C: 时，Kotlin 增量编译会因跨盘符 relativeTo 崩溃
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
